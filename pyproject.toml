[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

# Project Config

[project]
name = "darkdetect"
description = "Detect OS Dark Mode from Python"
readme = "README.md"
requires-python = ">=3.14"
dynamic = [ "version" ]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["jeepney (>=0.9.0) ; sys_platform == \"linux\""]

[project.license]
text = "BSD-3-Clause"

[[project.authors]]
name = "Alberto Sottile"
email = "asottile@gmail.com"

[project.urls]
homepage = "http://github.com/albertosottile/darkdetect"
download = "http://github.com/albertosottile/darkdetect/releases"

[project.optional-dependencies]
macos-listener = [ "pyobjc-framework-Cocoa>=12.2.2; platform_system == 'Darwin'" ]

# Tool Config

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic.version]
attr = "darkdetect.__version__"

[tool.setuptools.packages.find]
namespaces = false

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "radon>=6.0.1",
    "ruff>=0.15.0",
    "pytest (>=9.1.1,<10.0.0)",
    "pyobjc-framework-cocoa (>=12.2.2) ; sys_platform == \"darwin\"",
]

[tool.poetry]
package-mode = false

[tool.pyright]
include = ["darkdetect", "tests", "typings"]
# The Windows and macOS backends only type-check under their own platform; see scripts/pyright-*.json.
exclude = ["darkdetect/_windows_detect.py", "darkdetect/_mac_detect.py"]
typeCheckingMode = "strict"
pythonVersion = "3.14"


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PL", "PTH",
    "RUF", "ANN", "D", "S", "TRY", "PERF", "FURB", "T20", "ARG",
]
ignore = [
    "D203", "D213",  # conflict with D211 / D212
    "N802", "N803", "N806",  # camelCase isDark/isLight is public API
    "COM812",
    "PLR2004",  # platform version thresholds are not magic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "S603"]
# Stubs mirror jeepney's own names and signatures
"typings/*" = ["A002", "N802", "N818", "D", "ANN401", "PYI"]
"darkdetect/__init__.py" = ["F403", "F401", "F405"]
"darkdetect/__main__.py" = ["T201"]
"darkdetect/_windows_detect.py" = ["E402"]  # imports follow the platform guard

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
